workflows:
  build-android:
    name: Build Android APK

    environment:
      flutter: 3.24.0

    scripts:
      - name: Clean project
        script: |
          flutter clean

      - name: Get dependencies
        script: |
          flutter pub get

      - name: Regenerate Android project
        script: |
          rm -rf android/app/src/main/res
          flutter create --platforms=android --overwrite .

      - name: Verify resource filenames
        script: |
          echo "===== ANDROID RES FILES ====="
          find android/app/src/main/res -type f | sort

          echo "===== CHECK INVALID XML NAMES ====="
          find android/app/src/main/res -type f | grep -E '(\.xml|\.png).*[[:space:]]+$' && exit 1 || true

      - name: Verify Android embedding
        script: |
          grep -n "flutterEmbedding" android/app/src/main/AndroidManifest.xml

      - name: Get dependencies again
        script: |
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
