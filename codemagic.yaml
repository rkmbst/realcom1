workflows:
  build-android:
    name: Build Android APK

    environment:
      flutter: 3.24.0

    scripts:
      - name: Clean Flutter
        script: |
          flutter clean

      - name: Get dependencies
        script: |
          flutter pub get

      - name: Create clean Android project
        script: |
          rm -rf /tmp/wheel_android

          flutter create \
            --platforms=android \
            --project-name wheel_app \
            --org com.example \
            /tmp/wheel_android

          rm -rf android
          cp -R /tmp/wheel_android/android ./android

      - name: Add Android permissions
        script: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")

          permissions = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />
          """

          marker = '<application'
          if "android.permission.INTERNET" not in text:
              text = text.replace(marker, permissions + "\n    " + marker, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify Android project
        script: |
          echo "===== MAIN DART ====="
          head -40 lib/main.dart

          echo "===== MANIFEST ====="
          cat android/app/src/main/AndroidManifest.xml

          echo "===== EMBEDDING ====="
          grep -n "flutterEmbedding" android/app/src/main/AndroidManifest.xml || true

          echo "===== V1 CHECK ====="
          if grep -R -n \
            -e "io.flutter.app.FlutterApplication" \
            -e "io.flutter.app.FlutterActivity" \
            -e "io.flutter.app.FlutterFragmentActivity" \
            android; then
            echo "ERROR: Android V1 embedding detected"
            exit 1
          fi

          echo "===== RESOURCE FILES ====="
          find android/app/src/main/res -type f | sort

      - name: Get dependencies again
        script: |
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
