workflows:
  build-android:
    name: Build Android APK

    environment:
      flutter: 3.24.0

    scripts:
      - name: Clean project
        script: |
          flutter clean

      - name: Get dependencies
        script: |
          flutter pub get

      - name: Regenerate Android project
        script: |
          flutter create --platforms=android --overwrite .

      - name: Verify Android embedding
        script: |
          echo "===== MANIFEST ====="
          cat android/app/src/main/AndroidManifest.xml

          echo "===== EMBEDDING ====="
          grep -n "flutterEmbedding" android/app/src/main/AndroidManifest.xml

          echo "===== V1 CHECK ====="
          if grep -R -n \
            -e "io.flutter.app.FlutterApplication" \
            -e "io.flutter.app.FlutterActivity" \
            -e "io.flutter.app.FlutterFragmentActivity" \
            android; then
            echo "ERROR: Old Android V1 embedding detected"
            exit 1
          else
            echo "OK: No Android V1 embedding detected"
          fi

      - name: Get dependencies again
        script: |
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
